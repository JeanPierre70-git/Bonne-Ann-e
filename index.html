<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bonne Année✨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  height:100vh;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.8)),
    url("bg.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#fff;
}

/* Canvas confettis */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
}

/* Carte */
.card{
  z-index:2;
  background:rgba(35, 189, 228, 0.973);
  backdrop-filter:blur(10px);
  padding:48px 36px;
  border-radius:22px;
  max-width:640px;
  text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.4);
  animation:pop .9s ease;
}

h1{
  font-size:clamp(2rem, 5vw, 2rem);
  margin-bottom:18px;
}

#message{
  font-size:1.25rem;
  line-height:1.6;
  transition:opacity .7s ease, transform .7s ease;
}

.fade{
  opacity:0;
  transform:translateY(8px);
}

@keyframes pop{
  from{opacity:0; transform:scale(.96)}
  to{opacity:1; transform:scale(1)}
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">
  <h1>✨Bonne et Heureuse Année 2027✨</h1>
  <p id="message"></p>
</div>

<script>
/* ===== Messages (local = rapide) ===== */
const messages = [
  "✨ Bonne et heureuse année ! Que chaque jour soit une victoire.",
  "🎉 Une nouvelle année, une nouvelle chance de briller.",
  "🌟 Santé, paix et succès pour toi et ta famille.",
  "🚀 N’abandonne aucun rêve cette année.",
  "🥂 Que cette année t’élève plus haut que la précédente."
];

let i = 0;
const msg = document.getElementById("message");
msg.textContent = messages[i];

setInterval(() => {
  msg.classList.add("fade");
  setTimeout(() => {
    i = (i + 1) % messages.length;
    msg.textContent = messages[i];
    msg.classList.remove("fade");
  }, 700);
}, 10000);

/* ===== Confettis Canvas OPTIMISÉS ===== */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* Performance adaptative */
const CONFETTI_COUNT = innerWidth < 600 ? 60 : 120;

const confettis = Array.from({length: CONFETTI_COUNT}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  r: Math.random()*4+3,
  v: Math.random()*1.8+1,
  c: `hsl(${Math.random()*360},100%,60%)`
}));

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of confettis){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.c;
    ctx.fill();
    p.y+=p.v;
    if(p.y>canvas.height){
      p.y=-10;
      p.x=Math.random()*canvas.width;
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
